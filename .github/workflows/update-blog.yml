name: Update S&C Blog Slides
on:
  schedule:
    - cron: '0 22 * * *' # 07:00 KST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image compression dependency
        run: python -m pip install Pillow==11.3.0
      - name: Collect recent blog posts
        run: python3 scripts/update_blog.py
      - name: Commit verified blog data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/blog-posts.json images/blog/
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh blog slides"
            git push
          fi
