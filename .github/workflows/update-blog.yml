name: Update S&C Blog Slides
on:
  schedule:
    - cron: '0 22 * * *' # 07:00 KST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect posts and cache actual images
        run: python3 scripts/update_blog.py
      - name: Commit verified blog data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/blog-posts.json images/blog/
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh blog slides [skip ci]"
            git push
          fi
